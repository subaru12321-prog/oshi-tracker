# config.yaml としてコピーしてから、実際のアカウント情報を確認・修正してください。
# cp config.example.yaml config.yaml

members:
  - name: "メンバー名"
    showroom:
      room_url_key: "SHOWROOMのルームURLの末尾部分"
    instagram:
      username: "instagramのユーザー名(@なし)"
    tiktok:
      username: "TikTokのユーザー名(@なし)" # ローカル実行専用。クラウド(GitHub Actions)では収集しません。

# メンバー個人のアカウントではなく、グループ全体の情報源。
sources:
  official_site:
    sections:
      - news
      - schedule
  youtube:
    channel_ids:
      - "YouTubeのチャンネルID(UCで始まる文字列)"
