<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>推しトラッカー</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>推しトラッカー</h1>
  <p class="updated" id="updated"></p>

  <nav class="platform-nav" id="platform-nav">
    <button data-platform="" class="active">すべて</button>
    <button data-platform="showroom">showroom</button>
    <button data-platform="instagram">instagram</button>
    <button data-platform="x">x</button>
    <button data-platform="tiktok">tiktok</button>
  </nav>

  <select id="member-select">
    <option value="">メンバーで絞り込み(全員)</option>
  </select>
</header>

<main>
  <p class="empty" id="empty" hidden>投稿がありません。</p>
  <ul class="posts" id="posts"></ul>
</main>

<script src="app.js"></script>
</body>
</html>
